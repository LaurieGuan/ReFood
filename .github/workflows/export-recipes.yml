name: Export Hugging Face recipes (text only)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum recipe rows to fetch
        required: true
        default: '15698'
        type: string
      start_offset:
        description: Source row to start from (0 or a multiple of 100 for remaining shard)
        required: true
        default: '0'
        type: string
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch dataset metadata (no images)
        env:
          LIMIT: ${{ inputs.limit }}
          START_OFFSET: ${{ inputs.start_offset }}
        run: python scripts/export_hf_recipes.py --limit "$LIMIT" --start-offset "$START_OFFSET" --workers 1 --delay 3 --out dist/refood-recipes.jsonl.gz
      - name: Upload compressed recipe data (including partial export on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refood-recipes-text-only
          path: dist/refood-recipes.jsonl.gz
          if-no-files-found: error
          retention-days: 7
