name: Export Hugging Face recipes (text only)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum recipe rows to fetch
        required: true
        default: '15698'
        type: string
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch dataset metadata (no images)
        env:
          LIMIT: ${{ inputs.limit }}
        run: python scripts/export_hf_recipes.py --limit "$LIMIT" --workers 4 --out dist/refood-recipes.jsonl.gz
      - name: Upload compressed recipe data
        uses: actions/upload-artifact@v4
        with:
          name: refood-recipes-text-only
          path: dist/refood-recipes.jsonl.gz
          if-no-files-found: error
          retention-days: 7
